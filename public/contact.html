  <link rel="stylesheet" href="assets/styles.css" />
  
  <style>
    .box {
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 7px;
      margin-bottom: 20px;
    }

    body {
      font-family: 'Times New Roman', serif;
      font-size: 18px;
      background: #fcfbf9;
      color: #333;
    }

    table {
      width: 100%;
      font-family: 'Segoe Print', sans-serif;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: center;
    }

    th {
      width: auto;
    }

    a.nav-link {
      text-decoration: none;
      color: #333;
      transition: color 0.3s;
      white-space: nowrap;
    }

    a.nav-link:hover {
      color: #b0180a;
    }

    @media (max-width: 1024px) {
      table {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }

      th {
        flex: 1 1 30%;
        padding: 8px;
      }
    }

    .contact-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }

    .contact-info {
      flex: 1 1 350px;
    }

    .contact-info h2 {
      margin-bottom: 10px;
    }

    .contact-info p {
      font-size: 1.1em;
      margin: 8px 0;
    }

    .social-links {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }

    .social-links a img {
      width: 36px;
      height: 36px;
      transition: transform 0.2s ease-in-out;
    }

    .social-links a img:hover {
      transform: scale(1.15);
    }

    .map {
      flex: 1 1 400px;
      height: 350px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      text-align: center;
      margin: 40px 0 20px 0;
      font-size: 0.9em;
      color: #555;
    }
  </style>
</head>
